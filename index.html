<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odpočet</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="countdown-container">
        <!-- This div will be styled as a patch to cover the old numbers -->
        <div class="patch"></div>

        <div class="countdown">
            <div class="time-section" id="days-section">
                <span id="days"></span>
                <small>DNŮ</small>
            </div>
            <div class="time-section" id="hours-section">
                <span id="hours"></span>
                <small>HODINY</small>
            </div>
            <div class="time-section" id="minutes-section">
                <span id="minutes"></span>
                <small>MINUTY</small>
            </div>
            <!-- Seconds are not displayed but calculated for logic -->
            <div class="time-section" id="seconds-section" style="display: none;">
                <span id="seconds"></span>
                <small>VTEŘINY</small>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
