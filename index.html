<!DOCTYPE html>
<html lang="cs">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>vYpYčenÝ SoutředěnÝ 8 – Odpočet</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f1115" />
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <!-- Install banner -->
  <div id="installBanner" class="install-banner hidden">
    <div class="msg">📌 Můžeš si mě přidat na plochu pro rychlý přístup.</div>
    <div class="actions">
      <button id="installBtn" class="btn">Přidat</button>
      <button id="closeBanner" class="btn ghost">Zavřít</button>
    </div>
  </div>

  <header class="heading-wrap">
    <h1 class="mega-title">
      <img src="assets/8-Photoroom.png" class="beer-eight" alt="8" />
      <span class="weird">vYpYčenÝ SoutředěnÝ</span>
    </h1>
    <div class="start-time">Začátek: <strong>10.&nbsp;09.&nbsp;2026&nbsp;13:00</strong></div>
  </header>

  <main class="container">
    <section class="countdown-wrap">
      <div class="flip-grid">
        <div class="flip-unit">
          <div class="label">Dny</div>
          <div class="flip-card single" id="days"></div>
        </div>
        <div class="flip-unit">
          <div class="label">Hodiny</div>
          <div class="flip-card single" id="hours"></div>
        </div>
        <div class="flip-unit">
          <div class="label">Minuty</div>
          <div class="flip-card single" id="minutes"></div>
        </div>
        <div class="flip-unit">
          <div class="label">Sekundy</div>
          <div class="flip-card single" id="seconds"></div>
        </div>
      </div>


    </section>
  </main>

  <footer class="hero-bottom">
    <img src="assets/fina.png" alt="Pilsner Urquell + Božkov" class="hero-img" />
    <img src="assets/4dny.png" alt="4 dny" class="hero-img" />
  </footer>

  <script src="script.js"></script>
  <script src="pwa.js"></script>
</body>

</html>
